<p id="UrlInfo"></p>
<div class="table-responsive">
    <table class="table table-striped smallFontsizeInTable table-bordered">
        <thead>
            <tr>
                <th>Emne</th>
                <th>URL</th>
                <th>Forklaring</th>
            </tr>
        </thead>
        <tbody id="table-body-urls">
        </tbody>
    </table>
</div>

<h2><div id="loadingDataSpinner" style="display: none;">Henter data...</div></h2>

<div id="div-userName" class="text-center mb-1">
    <label for="user-name" class="form-label">Brugernavn:</label>
    <input type="text" id="user-name" class="form-control d-inline-block" style="width: 200px;">
    <input id="btnUserName" type="button" value="Gem Username i Local Storage" />
</div>

<input id="btnClearTextFields" type="button" value="Slet Tekstfelter" />
<input id="btnAddCar" type="button" value="Tilføj Car eller Car Model" />
<button type="button" id="cancel-button" style="display: none;">Annuller</button>

<hr />
<input type="text" id="txtCarName" placeholder="Car Navn">
<input type="number" id="txtCarYear" placeholder="Car Year">
<input type="number" id="txtCarPrice" placeholder="Car Price">
<input type="text" id="txtCarModel" placeholder="Car Model">

<div class="container mt-1">
    <div class="text-center mb-1">
        <p>Antal viste biler pr. side: 
            <input type="number" id="pageSize" class="form-control d-inline-block" value="5" min="1" style="width: 80px;">
        </p>
    </div>
    <div id="total-count-container" class="text-center mb-1">
        <p>Antal objekter : <span id="total-count">0</span></p>
    </div>
    <h2>Tabel med data</h2>
    <div class="table-responsive">
        <table id="data-table" class="table table-striped table-hover table-bordered ">
            <thead>
                <tr>
                    <th>Bil Id</th>
                    <th>Bilnavn</th>
                    <th>Bil Årgang</th>
                    <th>Bil Alder</th>
                    <th>Bil Pris</th>
                    <th>Bil Model</th>
                    <th>Handlinger</th>
                </tr>
            </thead>
            <tbody id="data-table-body">
            </tbody>
        </table>

        <table class="table table-striped" id="todo-list" style="display:none">
            <thead>
                <tr>
                    <th>Gennemført</th>
                    <th>Opgavenavn</th>
                    <th>Handlinger</th>
                </tr>
            </thead>
            <tbody id="table-body">
                </tbody>
        </table>
    </div>
    <div class="pagination-container">
        <nav>
            <ul class="pagination" id="pagination">
            </ul>
        </nav>
    </div>
</div>
